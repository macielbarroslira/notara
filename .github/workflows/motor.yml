# Motor do Notara: verifica os sites e atende os pedidos do app (Testar, Escolher na página, Verificar agora).
# Cada rodada fica ~55 min ligada (atende o app e responde o Telegram na hora). O agendamento
# a cada 10 min deixa a próxima rodada na fila, então o motor fica praticamente sempre ligado.
name: Motor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Uma rodada por vez; a próxima espera na fila (só uma fica esperando).
concurrency:
  group: motor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: motor/package-lock.json

      - name: Instalar
        working-directory: motor
        run: npm ci --no-audit --no-fund

      - name: Compilar
        working-directory: motor
        run: npm run build

      - name: Rodar o motor
        working-directory: motor
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          EMAIL_REMETENTE: "Notara <no-reply@notara.web.app>"
          CHROME_PATH: /usr/bin/google-chrome
          NOTARA_DURACAO_MS: "3300000"
        run: node lib/motor.js
